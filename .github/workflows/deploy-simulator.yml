name: Deploy SMK-37 HYBRID Virtual Lab
on:
  workflow_dispatch:
  push:
    branches: [hybrid-memory-reduction]
    paths:
      - "simulator/**"
      - "src/hybrid_core.c"
      - "include/hybrid_core.h"
      - "tests/test_hybrid_wasm_bridge.c"
      - ".github/workflows/deploy-simulator.yml"
  pull_request:
    paths:
      - "simulator/**"
      - "src/hybrid_core.c"
      - "include/hybrid_core.h"
      - "tests/test_hybrid_wasm_bridge.c"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install host C and WebAssembly tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential clang lld nodejs
      - name: Test real C mixer and bridge on host
        run: |
          set -eux
          cc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude src/hybrid_core.c tests/test_hybrid_core.c -o /tmp/test_hybrid_core
          /tmp/test_hybrid_core
          cc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude src/hybrid_core.c tests/test_hybrid_stress.c -o /tmp/test_hybrid_stress
          /tmp/test_hybrid_stress
          cc -std=c99 -O2 -Wall -Wextra -Werror -Itests/fakes -Iinclude src/hybrid_profile.c tests/test_hybrid_profile.c -o /tmp/test_hybrid_profile
          /tmp/test_hybrid_profile
          cc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude src/hybrid_core.c simulator/wasm_bridge.c tests/test_hybrid_wasm_bridge.c -o /tmp/test_hybrid_wasm_bridge
          /tmp/test_hybrid_wasm_bridge
      - name: Compile and execute browser WebAssembly core
        run: |
          set -eux
          clang --target=wasm32 -O2 -std=c99 -nostdlib -fno-builtin -Iinclude src/hybrid_core.c simulator/wasm_bridge.c \
            -Wl,--no-entry -Wl,--export-all -Wl,--export-memory \
            -Wl,--initial-memory=2097152 -Wl,--max-memory=16777216 -Wl,-z,stack-size=65536 \
            -o simulator/hybrid_core.wasm
          node -e "const fs=require('fs');(async()=>{const r=await WebAssembly.instantiate(fs.readFileSync('simulator/hybrid_core.wasm'),{});const e=r.instance.exports;if(e.hybrid_wasm_init()!==0)throw Error('core init');e.hybrid_wasm_note_on(60,100,0);if(e.hybrid_wasm_process(64)!==0)throw Error('render');const p=e.hybrid_wasm_output_ptr()>>>2;const a=new Int32Array(e.memory.buffer,p,128);if(!a.some(x=>x!==0))throw Error('silent mixer output');console.log('WASM core smoke PASS; exports:',Object.keys(e).length)})().catch(e=>{console.error(e);process.exit(1)})"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: hybrid-wasm-pr-validation
          path: simulator/hybrid_core.wasm
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: simulator
  deploy:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
