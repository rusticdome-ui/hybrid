name: Deploy SMK-37 HYBRID Virtual Lab
on:
  workflow_dispatch:
  push:
    branches: [hybrid-memory-reduction]
    paths:
      - "simulator/**"
      - "src/hybrid_core.c"
      - "include/hybrid_core.h"
      - "tests/test_hybrid_wasm_bridge.c"
      - "tests/test_native_wasm_pcm.js"
      - "tests/test_native_midi_latency.js"
      - "tests/test_audio_worklet_browser.js"
      - "tests/test_ghoulbox_wasm.js"
      - ".github/workflows/deploy-simulator.yml"
  pull_request:
    paths:
      - "simulator/**"
      - "src/hybrid_core.c"
      - "include/hybrid_core.h"
      - "tests/test_hybrid_wasm_bridge.c"
      - "tests/test_audio_worklet_browser.js"
      - "tests/test_ghoulbox_wasm.js"
      - ".github/workflows/deploy-simulator.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # A PR validation must not cancel the branch push that publishes Pages.
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout original AMB-1 source
        uses: actions/checkout@v4
        with:
          repository: genkigenki/fm1-amb
          ref: smk37
          path: engines/amb
      - name: Checkout original DUB-1 source
        uses: actions/checkout@v4
        with:
          repository: genkigenki/fm1-dub
          ref: smk37
          path: engines/dub
      - name: Checkout original ZEN-1 source
        uses: actions/checkout@v4
        with:
          repository: genkigenki/zen-1
          ref: smk37
          path: engines/zen
      - name: Checkout original GHOULBOX firmware source
        uses: actions/checkout@v4
        with:
          repository: genkigenki/Felucca
          ref: ghoulbox-smk37
          path: engines/ghoulbox
      - name: Install Emscripten for original native renderers
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache
      - name: Install upstream GHOULBOX build dependencies
        run: python3 -m pip install --user Pillow fonttools
      - name: Generate original GHOULBOX firmware tables and sample sets
        run: |
          set -euxo pipefail
          cd engines/ghoulbox
          mkdir -p build/gen build/emu
          python3 tools/gen_aa_font.py build/gen/ui_fonts.h --preset ghoulbox
          python3 tools/gen_aa_icons.py build/gen/ui_icons.h
          python3 tools/gen_aa_keycaps.py build/gen/ui_keycaps.h
          python3 tools/gen_ui_palettes.py build/gen/ui_palettes.h
          python3 tools/gen_tables.py build/gen/felucca_tables.h
          python3 tools/gen_fm6_patches.py build/gen/felucca_fm6.h
          python3 tools/gen_samples.py build/gen/felucca_samples.h
          python3 tools/gen_ghoulbox_art.py build/gen/ghoulbox_art.h
      - name: Compile original GHOULBOX firmware renderer to WebAssembly
        run: |
          set -euxo pipefail
          cd engines/ghoulbox
          emcc -O2 -ffp-contract=off -std=gnu99 -w -Ibuild/gen -Ifirmware/src \
            --no-entry -sSTANDALONE_WASM -sSTACK_SIZE=1048576 \
            -sINITIAL_MEMORY=33554432 -sFILESYSTEM=0 \
            -o build/emu/ghoulbox.wasm web/emu/felucca_web.c
          test -s build/emu/ghoulbox.wasm
          mkdir -p "$GITHUB_WORKSPACE/simulator/native"
          cp build/emu/ghoulbox.wasm "$GITHUB_WORKSPACE/simulator/native/ghoulbox.wasm"
          mkdir -p "$GITHUB_WORKSPACE/simulator/licenses/ghoulbox"
          cp LICENSE LICENSING.md "$GITHUB_WORKSPACE/simulator/licenses/ghoulbox/"
          cp -R LICENSES "$GITHUB_WORKSPACE/simulator/licenses/ghoulbox/"
          cp assets/samples-cc0/ATTRIBUTION.txt assets/samples-cc0/CREDITS.txt "$GITHUB_WORKSPACE/simulator/licenses/ghoulbox/"
          git rev-parse HEAD > "$GITHUB_WORKSPACE/simulator/licenses/ghoulbox/SOURCE_COMMIT.txt"
      - name: Verify original GHOULBOX firmware MIDI and PCM
        run: node tests/test_ghoulbox_wasm.js
      - name: Build original AMB-1, DUB-1 and ZEN-1 browser renderers
        run: |
          set -euxo pipefail
          (cd engines/amb && sh web/emu/build.sh)
          (cd engines/dub && sh web/emu/build.sh)
          (cd engines/zen && sh web/emu/build.sh)
          mkdir -p simulator/native
          cp engines/amb/build/emu/amb.wasm simulator/native/amb1.wasm
          cp engines/dub/build/emu/amb.wasm simulator/native/dub1.wasm
          cp engines/zen/build/emu/zen1.wasm simulator/native/zen1.wasm
          test -s simulator/native/amb1.wasm
          test -s simulator/native/dub1.wasm
          test -s simulator/native/zen1.wasm
      - name: Install WebAssembly linker and verify toolchain
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld zip
          command -v cc
          command -v clang
          command -v wasm-ld
          command -v node
          command -v zip
          cc --version
          clang --version
          wasm-ld --version
          node --version
      - name: Test real C mixer and bridge on host
        run: |
          set -eux
          cc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude src/hybrid_core.c tests/test_hybrid_core.c -o /tmp/test_hybrid_core
          /tmp/test_hybrid_core
          cc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude src/hybrid_core.c tests/test_hybrid_stress.c -o /tmp/test_hybrid_stress
          /tmp/test_hybrid_stress
          cc -std=c99 -O2 -Wall -Wextra -Werror -Itests/fakes -Iinclude src/hybrid_profile.c tests/test_hybrid_profile.c -o /tmp/test_hybrid_profile
          /tmp/test_hybrid_profile
          cc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude src/hybrid_core.c simulator/wasm_bridge.c tests/test_hybrid_wasm_bridge.c -o /tmp/test_hybrid_wasm_bridge
          /tmp/test_hybrid_wasm_bridge
      - name: Validate original DSP renderers and browser adapter
        run: |
          set -euxo pipefail
          node --check simulator/native-engines.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("simulator/index.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("No inline simulator script found")
          Path("/tmp/hybrid-simulator-inline.js").write_text(scripts[-1])
          PY
          node --check /tmp/hybrid-simulator-inline.js
          node <<'NODE'
          const fs = require('fs');
          global.window = global;
          global.fetch = async url => ({ok:true,arrayBuffer:async()=>fs.readFileSync('simulator/'+url.replace(/^\.\//,''))});
          require('./simulator/native-engines.js');
          (async()=>{
            const rack=new HYBRIDNativeEngines.NativeEngineRack();
            const loaded=await rack.loadAll();
            for(const e of rack.engines.values()){
              if(e.id===2)e.exports.web_key(0,1);else e.exports.web_keys(1);
              e.exports.web_render(128);
              const l=new Float32Array(e.exports.memory.buffer,e.exports.web_out_l()>>>0,128);
              const r=new Float32Array(e.exports.memory.buffer,e.exports.web_out_r()>>>0,128);
              if(![...l,...r].every(Number.isFinite)||![...l,...r].some(x=>x!==0))
                throw new Error(e.name+': silent or invalid original DSP PCM');
              console.log(e.name+': original DSP PCM PASS');
            }
            console.log('Browser WASI adapter PASS:',loaded.join(', '));
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
      - name: Validate MIDI note dispatch and measure original DSP WASM latency
        run: |
          set -euxo pipefail
          node tests/test_native_midi_latency.js
      - name: Compile and execute browser WebAssembly core
        run: |
          set -eux
          clang --target=wasm32 -O2 -std=c99 -nostdlib -fno-builtin -Iinclude src/hybrid_core.c simulator/wasm_bridge.c \
            -Wl,--no-entry -Wl,--export-all -Wl,--export-memory \
            -Wl,--initial-memory=2097152 -Wl,--max-memory=16777216 -Wl,-z,stack-size=65536 \
            -o simulator/hybrid_core.wasm
          node -e "const fs=require('fs');(async()=>{const r=await WebAssembly.instantiate(fs.readFileSync('simulator/hybrid_core.wasm'),{});const e=r.instance.exports;if(e.hybrid_wasm_init()!==0)throw Error('core init');e.hybrid_wasm_note_on(60,100,0);if(e.hybrid_wasm_process(64)!==0)throw Error('render');const p=e.hybrid_wasm_output_ptr()>>>2;const a=new Int32Array(e.memory.buffer,p,128);if(!a.some(x=>x!==0))throw Error('silent mixer output');console.log('WASM core smoke PASS; exports:',Object.keys(e).length)})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Verify original DSP PCM identity through HYBRID mixer
        run: |
          set -euxo pipefail
          node tests/test_native_wasm_pcm.js
      - name: Install Playwright Chromium for real AudioWorklet browser test
        run: |
          set -eux
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Validate AudioWorklet in headless Chromium
        run: node tests/test_audio_worklet_browser.js
      - name: Package standalone virtual lab
        run: |
          set -eux
          test -s simulator/index.html
          test -s simulator/hybrid_core.wasm
          test -s simulator/native/ghoulbox.wasm
          test -s simulator/licenses/ghoulbox/LICENSE
          (cd simulator && zip -9 -r ../smk37-hybrid-virtual-lab.zip index.html native-engines.js audio-worklet.js hybrid_core.wasm README.md native licenses)
          test -s smk37-hybrid-virtual-lab.zip
      - uses: actions/upload-artifact@v4
        with:
          name: smk37-hybrid-virtual-lab
          path: simulator/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: smk37-hybrid-virtual-lab-zip
          path: smk37-hybrid-virtual-lab.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: hybrid-wasm-pr-validation
          path: simulator/hybrid_core.wasm
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: simulator
  deploy:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
