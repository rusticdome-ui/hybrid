name: Native DSP WASM build pipeline

on:
  workflow_dispatch:
  push:
    branches: [hybrid-memory-reduction]
    paths:
      - ".github/workflows/native-engines-wasm.yml"
      - "simulator/native/**"
      - "simulator/native-engines.js"
      - "simulator/index.html"
      - "simulator/README.md"
      - "tests/test_hybrid_wasm_bridge.c"
      - "tests/test_native_midi_latency.js"
  pull_request:
    paths:
      - ".github/workflows/native-engines-wasm.yml"
      - "simulator/native/**"
      - "simulator/native-engines.js"
      - "simulator/index.html"

permissions:
  contents: read

jobs:
  build-native-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HYBRID
        uses: actions/checkout@v4

      - name: Checkout original AMB-1 source
        uses: actions/checkout@v4
        with:
          repository: genkigenki/fm1-amb
          ref: smk37
          path: engines/amb

      - name: Checkout original DUB-1 source
        uses: actions/checkout@v4
        with:
          repository: genkigenki/fm1-dub
          ref: smk37
          path: engines/dub

      - name: Checkout original ZEN-1 source
        uses: actions/checkout@v4
        with:
          repository: genkigenki/zen-1
          ref: smk37
          path: engines/zen

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache

      - name: Install upstream font generator dependency
        run: python3 -m pip install --user Pillow

      - name: Build the three upstream WebAssembly engines independently
        shell: bash
        run: |
          set -euxo pipefail
          emcc --version
          (cd engines/amb && sh web/emu/build.sh)
          (cd engines/dub && sh web/emu/build.sh)
          (cd engines/zen && sh web/emu/build.sh)
          mkdir -p simulator/native
          cp engines/amb/build/emu/amb.wasm simulator/native/amb1.wasm
          cp engines/dub/build/emu/amb.wasm simulator/native/dub1.wasm
          cp engines/zen/build/emu/zen1.wasm simulator/native/zen1.wasm
          test -s simulator/native/amb1.wasm
          test -s simulator/native/dub1.wasm
          test -s simulator/native/zen1.wasm

      - name: Validate WASM binaries and native renderer exports
        shell: bash
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { WASI } = require('node:wasi');
          const specs = [
            ['AMB-1', 'simulator/native/amb1.wasm'],
            ['DUB-1', 'simulator/native/dub1.wasm'],
            ['ZEN-1', 'simulator/native/zen1.wasm'],
          ];
          for (const [name, path] of specs) {
            const bytes = fs.readFileSync(path);
            const mod = new WebAssembly.Module(bytes);
            const names = new Set(WebAssembly.Module.exports(mod).map(x => x.name));
            for (const required of ['web_boot', 'web_render', 'web_out_l', 'web_out_r']) {
              if (!names.has(required)) throw new Error(name + ': missing original renderer export ' + required);
            }
            for (const control of ['web_keys', 'web_buttons', 'web_enc', 'web_master']) {
              if (!names.has(control)) throw new Error(name + ': missing native control export ' + control);
            }
            console.log(name + ': valid WASM; original host renderer and control exports present; ' + bytes.length + ' bytes');
          }
          NODE

      - name: Render original DSP through browser WASI adapter and reject silent PCM
        shell: bash
        run: |
          set -euxo pipefail
          node <<'NODE'
          const fs = require('fs');
          global.window = global;
          global.fetch = async url => ({ok:true,arrayBuffer:async()=>fs.readFileSync('simulator/'+url.replace(/^\.\//,''))});
          require('./simulator/native-engines.js');
          (async()=>{
            const rack=new HYBRIDNativeEngines.NativeEngineRack();
            const loaded=await rack.loadAll();
            for(const e of rack.engines.values()){
              e.exports.web_keys(1);
              e.exports.web_render(128);
              const l=new Float32Array(e.exports.memory.buffer,e.exports.web_out_l()>>>0,128);
              const r=new Float32Array(e.exports.memory.buffer,e.exports.web_out_r()>>>0,128);
              if(![...l,...r].every(Number.isFinite)||![...l,...r].some(x=>x!==0))
                throw new Error(e.name+': silent or invalid original DSP PCM');
              console.log(e.name+': original DSP PCM PASS');
            }
            console.log('Browser WASI adapter PASS:',loaded.join(', '));
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

      - name: Validate MIDI note dispatch and measure original DSP WASM latency
        shell: bash
        run: |
          set -euxo pipefail
          node tests/test_native_midi_latency.js

      - name: Verify exact three-input PCM transport and Q15 mix
        shell: bash
        run: |
          set -euxo pipefail
          cc -std=c99 -Wall -Wextra -Werror -Iinclude src/hybrid_core.c simulator/wasm_bridge.c tests/test_hybrid_wasm_bridge.c -o /tmp/test_hybrid_wasm_bridge
          /tmp/test_hybrid_wasm_bridge
          echo "HYBRID PCM transport and independent Q15 sum oracle: PASS"

      - name: Validate browser native adapter and simulator JavaScript syntax
        shell: bash
        run: |
          set -euxo pipefail
          node --check simulator/native-engines.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("simulator/index.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("No inline simulator script found")
          Path("/tmp/hybrid-simulator-inline.js").write_text(scripts[-1])
          PY
          node --check /tmp/hybrid-simulator-inline.js

      - name: Upload independent native engine modules
        uses: actions/upload-artifact@v4
        with:
          name: smk37-hybrid-native-engines-wasm
          path: simulator/native/*.wasm
          if-no-files-found: error
          retention-days: 30
